name: build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Ehcp.slnx
      - run: dotnet build Ehcp.slnx -c Release --no-restore
      - run: dotnet test tests/Ehcp.Tests -c Release --no-build

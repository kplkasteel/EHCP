trigger: none

# Test: queue new runs behind the running one instead of cancelling it.
concurrency:
  group: pr-validation
  cancelInProgress: false

pool:
  vmImage: windows-latest

variables:
  - template: variables/global.yml

steps:
  - pwsh: |
      Write-Host "Build:            $(Build.BuildId)"
      Write-Host "Agent name:       $(Agent.Name)"
      Write-Host "Agent id:         $(Agent.Id)"
      Write-Host "Agent machine:    $(Agent.MachineName)"
      Write-Host "Computer name:    $env:COMPUTERNAME"
      Write-Host "VM UUID:          $((Get-CimInstance Win32_ComputerSystemProduct).UUID)"
      Write-Host "Image:            $env:ImageOS $env:ImageVersion"
      Write-Host "Started (UTC):    $((Get-Date).ToUniversalTime().ToString('s'))"
    displayName: Show runner identity

  - template: templates/install-tools.yml
    parameters:
      rubyVersion: ${{ variables.rubyVersion }}
      nodeVersion: ${{ variables.nodeVersion }}
      azuriteVersion: ${{ variables.azuriteVersion }}
      funcVersion: ${{ variables.funcVersion }}

  # Rake sets UnitTestsStarted and SpecsStarted as each stage begins. The publish steps check them.
  - pwsh: |
      rake go
      exit $LASTEXITCODE
    displayName: Rake go (build, unit tests, specs)
    timeoutInMinutes: 30

  - task: PublishTestResults@2
    condition: and(always(), eq(variables['UnitTestsStarted'], 'true'))
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: 'tests/Ehcp.Tests/TestResults/*.trx'
      testRunTitle: 'Unit tests'
      failTaskOnFailedTests: false
    displayName: Publish unit test results

  - task: PublishTestResults@2
    condition: and(always(), eq(variables['SpecsStarted'], 'true'))
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: 'tests/Ehcp.Specs/TestResults/*.trx'
      testRunTitle: 'Specs'
      failTaskOnFailedTests: false
    displayName: Publish Specs test results

  - task: PublishPipelineArtifact@1
    condition: and(always(), eq(variables['SpecsStarted'], 'true'))
    continueOnError: true
    inputs:
      targetPath: tests/Ehcp.Specs/TestResults
      artifact: specs-results-and-logs
    displayName: Publish spec results and host logs

  # Summarises the test results for the PR comment. Runs on every build, PR or not.
  - task: PowerShell@2
    condition: always()
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/.azuredevops/scripts/summarise-results.ps1
      arguments: -OverallStatus '$(Agent.JobStatus)'
      pwsh: true
    displayName: Summarise test results

  # Posts or updates the PR comment. A failed post is a warning and does not fail the build.
  - task: PowerShell@2
    condition: and(always(), eq(variables['Build.Reason'], 'PullRequest'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/.azuredevops/scripts/post-pr-comment.ps1
      pwsh: true
    displayName: Post PR comment
